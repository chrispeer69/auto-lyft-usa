<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/auto_logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <!--
      These are the site-wide defaults. Every page overrides the title,
      description, canonical URL and structured data at runtime via
      src/components/Seo.tsx, and the prerender step bakes the correct values
      into each page's static HTML at build time.
    -->
    <title>Auto Lyft USA - 24/7 Towing Columbus, Dayton &amp; Cincinnati Ohio</title>
    <meta name="description" content="Fast, reliable 24/7 towing and roadside assistance in Columbus, Dayton & Cincinnati, Ohio. Emergency towing, jump starts, lockout service & more. 15-min avg response time. Call 614-633-7935 now!" />
    <meta name="author" content="Auto Lyft USA" />

    <link rel="canonical" href="https://autolyftusa.online" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Auto Lyft USA - 24/7 Towing Columbus, Dayton & Cincinnati Ohio" />
    <meta property="og:description" content="Fast, reliable 24/7 towing and roadside assistance in Columbus, Dayton & Cincinnati, Ohio. Call 614-633-7935 now!" />
    <meta property="og:url" content="https://autolyftusa.online" />
    <meta property="og:image" content="https://autolyftusa.online/auto_logo.jpg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Auto Lyft USA" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Auto Lyft USA - 24/7 Towing Columbus, Dayton & Cincinnati Ohio" />
    <meta name="twitter:description" content="Fast, reliable 24/7 towing and roadside assistance in Columbus, Dayton & Cincinnati, Ohio. Call 614-633-7935 now!" />
    <meta name="twitter:image" content="https://autolyftusa.online/auto_logo.jpg" />

    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <meta name="geo.region" content="US-OH" />
    <meta name="geo.placename" content="Columbus, Dayton, Cincinnati, Ohio" />

    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="dns-prefetch" href="https://images.pexels.com" />

    <!--
      Site-wide identity. Appears on every page so search engines can tie all
      96 URLs to one business. Page-specific schema (Service, City, FAQ,
      BlogPosting) is injected separately by the prerender step.
      NOTE: fill in `sameAs` with your real Google Business Profile and social
      URLs — that is the strongest signal for the local knowledge panel.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://autolyftusa.online/#organization",
          "name": "Auto Lyft USA",
          "url": "https://autolyftusa.online",
          "logo": {
            "@type": "ImageObject",
            "url": "https://autolyftusa.online/auto_logo.jpg",
            "width": 229,
            "height": 146
          },
          "telephone": "+1-614-633-7935",
          "email": "info@autolyftusa.com",
          "areaServed": [
            { "@type": "City", "name": "Columbus", "addressRegion": "OH", "addressCountry": "US" },
            { "@type": "City", "name": "Dayton", "addressRegion": "OH", "addressCountry": "US" },
            { "@type": "City", "name": "Cincinnati", "addressRegion": "OH", "addressCountry": "US" }
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+1-614-633-7935",
            "contactType": "emergency",
            "areaServed": "US-OH",
            "availableLanguage": "English",
            "hoursAvailable": {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
              "opens": "00:00",
              "closes": "23:59"
            }
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://autolyftusa.online/#website",
          "url": "https://autolyftusa.online",
          "name": "Auto Lyft USA",
          "publisher": { "@id": "https://autolyftusa.online/#organization" },
          "inLanguage": "en-US"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
